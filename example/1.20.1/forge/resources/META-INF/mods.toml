modLoader = "javafml"
loaderVersion = "[47,)"
license = "MIT"

[[mods]]
modId = "example"
version = "1.0.0"
displayName = "TRMTR API example"
authors = "Xeptix"
description = '''
The example mod of the TRMTR API: four blocks described by data, a plugin with a listener, a wearer rule and a render
hook, and /examplewear. Built into development runs only.
'''

[[dependencies.example]]
    modId = "minecraft"
    mandatory = true
    versionRange = "[1.20.1,1.21)"
    ordering = "NONE"
    side = "BOTH"

# Optional, and made before TRMTR where both are there, so the plugin's answers are given before TRMTR loads plugins.
[[dependencies.example]]
    modId = "trmtgtnh"
    mandatory = false
    versionRange = "[0,)"
    ordering = "BEFORE"
    side = "BOTH"
